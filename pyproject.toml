[project]
name = "feature-data-pruning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "evaluate>=0.4.6",
    "peft>=0.18.1",
    "pillow>=12.1.0",
    "rouge-score>=0.1.2",
    "sae-lens>=6.30.0",
    "tabulate>=0.9.0",
    "trl>=0.27.0",
    "pydantic",
    "pyyaml",
    "matplotlib",
    "seaborn>=0.13.2",
    "lm-eval[ifeval,math,sentencepiece]>=0.4.11",
    "langdetect>=1.0.9",
    "immutabledict>=4.3.1",
    "faiss-cpu>=1.13.2",
    "vllm==0.19.1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
# torchaudio = { index = "pytorch-cu128" }

[project.scripts]
mvp = "mvp.main:main"
fdp = "src.main:main"
gen-ref-models = "src.reference_models:main"
gen-sni-data = "src.utils.sni_data_gen:main"
sota-comps = "src.sota_comparisons:main"
