
# Experiment configuration for MVP pipeline
# Adjust values as needed for your experiment sweep
suite_title: "mvp_and_more"
output_dir: "experiments"
seed: 3
base_model_id: "google/gemma-2-2b"
tokenizer_id: "google/gemma-2-9b-it"
prune:
  model_id: "google/gemma-2-9b-it"
  sae_release: "gemma-scope-9b-it-res"
  sae_id: "layer_20/width_16k/average_l0_91"
  dataset_id: "yahma/alpaca-cleaned"
  batch_size: 8
  max_length: &len 4750
  num_samples: &samples 10000
  top_k_features: [60]
  prune_thresholds: [0.0, 10.0, 15.0, 20.0, 25.0]
sft:
  max_seq_length: *len
  learning_rate: 0.0002
  max_original_samples: *samples
  batch_size: 16
eval:
  num_samples: 1000
  max_new_tokens: 1024
  batch_size:  24
