title: "gemma3_no_entropy_357"
output_dir: "experiments"
seed: 3
run_null_analysis: false
num_null_trials: 10
prune:
  cfg:
    prune_model_id: &prune_model "google/gemma-3-270m-it"
    sae_release: "gemma-scope-2-270m-it-res"
    sae_id: "layer_9_width_65k_l0_medium"
    dataset_id: "yahma/alpaca-cleaned"
    num_samples: &samples 51760
    seq_agg_method: "sum"  # possible values: "sum", "mean", "max"
    feat_agg_method: "sum"  # possible values: "sum", "mean"
    divide_by_entropy: false
  params:
    batch_size: 8
    dataset_sizes: [10, 100, 500, 800, 1000, 3000, 5000, 10000, 51760]
    topk_features: [3, 5, 7]
sft:
  cfg:
    tokenizer_id: *prune_model
    base_model_id: "google/gemma-3-1b-pt"
    max_seq_length: 4750
    learning_rate: 0.0002
    max_original_samples: *samples
  params:
    batch_size: 2
eval:
  cfg:
    num_samples: 300
    max_new_tokens: 256
    ollama_judge: "llama3.3:70b"
  params:
    batch_size:  32