    #   judge_max_tokens: 256
    #   temperature: 0.0
    #   top_p: 1.0
    #   batch_size: 4
    #   model_kwargs:
    #     tensor_parallel_size: 1
    #     gpu_memory_utilization: 0.9
    #   client_kwargs: {}
  params:
    batch_size: 4
