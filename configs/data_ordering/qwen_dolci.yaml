title: "qwen_dolci"
output_dir: "data-ordering"
seed: 3
run_null_analysis: false
num_null_trials: 10
debug_mode: false
prune:
  cfg:
    prune_model_id: &prune_model "google/gemma-3-270m"
    sae_release: "gemma-scope-2-270m-pt-res"
    sae_id: "layer_9_width_65k_l0_medium"
    dataset_id: "allenai/Dolci-Instruct-SFT-No-Tools"
    num_samples: &samples 51760
    seq_agg_method: "sum"  # possible values: "sum", "mean", "max"
    feat_agg_method: "sum"  # possible values: "sum", "mean"
    divide_by_entropy: true
  params:
    batch_size: 12
    dataset_sizes: [51760]
    topk_features: [5]
sft:
  cfg:
    tokenizer_id: Qwen/Qwen3.5-9B
    base_model_id: Qwen/Qwen3.5-9B-Base
    max_seq_length: 1024
    learning_rate: 0.0002
    max_original_samples: *samples
  params:
    batch_size: 2
eval:
  cfg:
    num_samples: 300
    max_new_tokens: 256
    # ollama_judge: "llama3.3:70b"
    ollama_judge: "gemma3:27b-it-qat"
    num_ref_models: 3
    tasks:
      - leaderboard
    task_limit: null
  params:
    batch_size: 2  # 32