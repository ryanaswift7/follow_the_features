title: olmo_dolci
output_dir: experiments
seeds: [3]
debug_mode: false
prune:
  cfg:
    prune_model_id: google/gemma-3-270m-it
    sae_release: gemma-scope-2-270m-it-res
    sae_id: layer_9_width_65k_l0_medium
    dataset_id: allenai/Dolci-Instruct-SFT-No-Tools
    num_samples: 1924533
    seq_agg_method: max
    feat_agg_method: mean
    divide_by_entropy: true
  params:
    batch_size: 12
    dataset_sizes:
    - 1924533
    topk_features:
    - 50
sft:
  cfg:
    tokenizer_id: allenai/Olmo-3-7B-Instruct-SFT
    base_model_id: allenai/Olmo-3-1025-7B
    max_seq_length: 4096
    learning_rate: 0.0002
    lr_scheduler_type: cosine
    full_ft: false
  params:
    batch_size: 2
eval:
  cfg:
    lm_eval:
      run: true
      max_new_tokens: 1024
      tasks:
      - leaderboard
      task_limit: null
    alpacaeval:
      run: true
      candidate_backend: vllm
      judge_backend: vllm
      model_name: Qwen/Qwen3.8-27B-FP8
      dataset: alpaca_eval_gpt4_baseline
      max_instances: 300
      max_new_tokens: 1024
      judge_max_tokens: 512
      temperature: 0.0
      top_p: 1.0
      batch_size: 1
      model_kwargs: {}
      client_kwargs: {}
  params:
    batch_size: 8
