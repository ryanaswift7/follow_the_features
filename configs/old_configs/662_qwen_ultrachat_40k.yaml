title: 662_qwen_ultrachat_40k
output_dir: experiments
seeds: [3]
debug_mode: false
prune:
  cfg:
    prune_model_id: google/gemma-3-270m
    sae_release: gemma-scope-2-270m-pt-res
    sae_id: layer_9_width_65k_l0_medium
    dataset_id: HuggingFaceH4/ultrachat_200k
    num_samples: 207865
    seq_agg_method: sum
    feat_agg_method: sum
    divide_by_entropy: true
  params:
    batch_size: 12
    dataset_sizes:
    - 40000
    topk_features:
    - 5
sft:
  cfg:
    tokenizer_id: Qwen/Qwen3-4B
    base_model_id: Qwen/Qwen3-4B-Base
    max_seq_length: 2048
    learning_rate: 0.0002
    lr_scheduler_type: cosine
    max_original_samples: 207865
    full_ft: false
  params:
    batch_size: 2
eval:
  cfg:
    lm_eval:
      run: true
      max_new_tokens: 256
      tasks:
      - leaderboard
      task_limit: null
    alpacaeval:
      run: true
      candidate_backend: vllm
      judge_backend: vllm
      model_name: Qwen/Qwen3.8-27B-FP8
      dataset: alpaca_eval_gpt4_baseline
      max_instances: 300
      max_new_tokens: 256
      judge_max_tokens: 100
      temperature: 0.0
      top_p: 1.0
      batch_size: 1
      model_kwargs: {}
      client_kwargs: {}
  params:
    batch_size: 8
