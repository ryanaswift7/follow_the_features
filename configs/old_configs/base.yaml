title: base
output_dir: experiments
seeds: [3]
prune:
  cfg:
    model_id: google/gemma-2-9b-it
    sae_release: gemma-scope-9b-it-res
    sae_id: layer_20/width_16k/average_l0_91
    dataset_id: yahma/alpaca-cleaned
    num_samples: 10000
    seq_agg_method: sum
    feat_agg_method: sum
  params:
    batch_size: 16
    dataset_sizes:
    - 2000
    - 4000
    - 6000
    - 8000
    - 10000
    topk_features:
    - 30
    - 60
    - 90
sft:
  cfg:
    tokenizer_id: google/gemma-2-9b-it
    base_model_id: google/gemma-2-2b
    max_seq_length: 4750
    learning_rate: 0.0002
    lr_scheduler_type: cosine
    max_original_samples: 10000
  params:
    batch_size: 4
eval:
  cfg:
    lm_eval:
      run: true
      max_new_tokens: 256
      tasks: null
      task_limit: null
    alpacaeval:
      run: true
      candidate_backend: vllm
      judge_backend: vllm
      model_name: Qwen/Qwen3.8-27B-FP8
      dataset: alpaca_eval_gpt4_baseline
      max_instances: 300
      max_new_tokens: 256
      judge_max_tokens: 100
      temperature: 0.0
      top_p: 1.0
      batch_size: 1
      model_kwargs: {}
      client_kwargs: {}
  params:
    batch_size: 32
