title: debug
output_dir: debugging
seed: 3
debug_mode: true
prune:
  cfg:
    prune_model_id: google/gemma-3-270m-it
    sae_release: gemma-scope-2-270m-it-res
    sae_id: layer_9_width_65k_l0_medium
    dataset_id: yahma/alpaca-cleaned
    num_samples: 2
    seq_agg_method: last_token
    feat_agg_method: mean
    divide_by_entropy: true
    diversity_param: 0.2
  params:
    batch_size: 2
    dataset_sizes:
    - 2
    topk_features:
    - 10
sft:
  cfg:
    tokenizer_id: google/gemma-3-270m-it
    base_model_id: google/gemma-3-1b-pt
    max_seq_length: 10
    learning_rate: 0.0002
    max_original_samples: 2
  params:
    batch_size: 2
eval:
  cfg:
    num_ref_models: 2
    lm_eval:
      run: true
      max_new_tokens: 2
      tasks:
      - leaderboard
      task_limit: 1
    alpacaeval:
      run: true
      backend: vllm
      model_name: google/gemma-3-4b-it
      dataset: alpaca_eval_gpt4_baseline
      max_instances: 2
      max_new_tokens: 50
      judge_max_tokens: 100
      temperature: 0.0
      top_p: 1.0
      local_server_host: 127.0.0.1
      local_server_port: 8000
      model_kwargs:
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.9
      client_kwargs: {}
  params:
    batch_size: 1
