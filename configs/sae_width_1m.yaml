title: "sae_width_1m"
output_dir: "experiments"
seed: 3
run_null_analysis: false
num_null_trials: 10
debug_mode: false
prune:
  cfg:
    prune_model_id: &prune_model "google/gemma-3-270m"
    sae_release: "gemma-scope-2-270m-pt-res"
    sae_id: "layer_9_width_1m_l0_medium"
    dataset_id: "yahma/alpaca-cleaned"
    num_samples: &samples 51760
    seq_agg_method: "sum"  # possible values: "sum", "mean", "max"
    feat_agg_method: "sum"  # possible values: "sum", "mean"
    divide_by_entropy: true
  params:
    batch_size: 12
    dataset_sizes: [10000, 51760]  # [500, 5000, 10000, 20000, 51760]
    topk_features: [1, 5, 10, 50, 100, 150, 200]
sft:
  cfg:
    tokenizer_id: "google/gemma-3-270m-it"
    base_model_id: "google/gemma-3-1b-pt"
    max_seq_length: 4750
    learning_rate: 0.0002
    max_original_samples: *samples
  params:
    batch_size: 2
eval:
  cfg:
    num_samples: 300
    max_new_tokens: 256
    ollama_judge: "llama3.3:70b"
    num_ref_models: 3
    tasks: null
      # - leaderboard
    task_limit: null
  params:
    batch_size: 8  # 32